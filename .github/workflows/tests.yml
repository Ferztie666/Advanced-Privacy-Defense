name: Linux tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate installer syntax
        run: bash -n install.sh
      - name: Compile
        run: python -m py_compile pps.py
      - name: Validate CLI entry point
        run: python pps.py --help
      - name: Built-in tests
        run: python pps.py self-test
      - name: Test suite
        run: python -m unittest discover -s tests -v
